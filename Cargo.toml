[package]
name = "hyraxql"
version = "0.2.0"
edition = "2024"

[dependencies]
aes-gcm = "0.11.0"
async-trait = "0.1.89"
keyring = { version="4.1.4", features=["v1"]}
rand = "0.10.2"
regex = "1.12.4"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "tls-rustls", "postgres", "mysql", "sqlite", "any"] }
tokio = { version = "1", features = ["full"] }
users = "0.11.0"
